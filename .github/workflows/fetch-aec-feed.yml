name: Fetch AEC Media Feed

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: aec-feed
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Download latest AEC feed zip
        run: |
          ELECTION_ID="31496"
          FTP_DIR="ftp://mediafeedarchive.aec.gov.au/${ELECTION_ID}/Detailed/Verbose/"

          # List directory and pick the most recent zip (filenames sort chronologically)
          LATEST=$(curl -fL --retry 5 --retry-delay 10 --silent --list-only "${FTP_DIR}" | grep '\.zip$' | sort | tail -1)

          if [ -z "$LATEST" ]; then
            echo "No zip file found on FTP server"
            exit 1
          fi

          echo "Latest file: $LATEST"
          curl -fL --retry 5 --retry-delay 10 --silent --output feed.zip "${FTP_DIR}${LATEST}"

      - name: Extract XML from zip
        run: |
          ELECTION_ID="29807"

          mkdir -p extracted
          unzip -j feed.zip "xml/*.xml" -d extracted/
          FILE=$(ls extracted/*.xml 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "No XML extracted"
            exit 1
          fi
          # Store path for upload step
          echo "XML_FILE=$FILE" >> "$GITHUB_ENV"
          echo "ELECTION_ID=$ELECTION_ID" >> "$GITHUB_ENV"

      - name: Upload XML to Cloudflare Worker
        run: |
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.AEC_WORKER_UPLOAD_SECRET }}" \
            -H "Content-Type: application/xml" \
            --data-binary "@${XML_FILE}" \
            "https://aec-election-feed.jwood748787.workers.dev/upload/${ELECTION_ID}")

          echo "Response: $(cat response.json)"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Upload failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "Upload successful"
